<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo of a Pigeon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main">

    <!-- ============ PORTE : 1 ou 2 tests aléatoires ============ -->
    <section id="gate">
      <div class="brand-bar">
        <div class="brand-logo">🔒</div>
        <div class="brand-name">reCAPTCHA</div>
        <div class="brand-secure">SÉCURISÉ · v3.2.1</div>
      </div>

      <div class="panel">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

        <div class="panel-head">
          <div class="panel-title" id="panelTitle">Vérification humaine</div>
          <div class="panel-sub"   id="panelSub">Complétez le défi de sécurité ci-dessous</div>
        </div>

        <div class="panel-body" id="panelBody"></div>

        <div class="panel-foot">
          <div class="foot-icon">🛡️</div>
          <div class="foot-text">Prouvez que vous pouvez regarder un pigeon.</div>
          <div class="foot-logo">Google</div>
        </div>
      </div>
    </section>

    <!-- ============ SITE : la photo du pigeon ============ -->
    <section id="site" hidden>
      <img class="bg" src="pigeon.jpg" alt="Un pigeon biset perché sur un rebord de pierre">
      <div class="timer-card">
        <div class="label">Temps total passé à regarder ce pigeon</div>
        <div class="total" id="timerTotal">0 s</div>
        <div class="visit">Cette visite : <span id="timerSession">0 s</span></div>
      </div>
    </section>

  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="main.js"></script>

</body>
</html>
